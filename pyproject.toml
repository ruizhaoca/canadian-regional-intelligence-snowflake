[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "canadian-regional-intelligence"
version = "0.1.0"
description = "Statistics Canada acquisition for an Azure and Snowflake regional intelligence platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "azure-identity>=1.19,<2",
  "azure-storage-blob>=12.24,<13",
  "azure-storage-file-datalake>=12.18,<13",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "tenacity>=9,<10",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "respx>=0.22,<1",
  "ruff>=0.9,<1",
  "sqlfluff>=3.4,<4",
]

[project.scripts]
regional-intelligence-acquire = "regional_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
regional_intelligence = ["py.typed"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["regional_intelligence"]

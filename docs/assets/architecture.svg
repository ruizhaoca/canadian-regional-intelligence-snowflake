<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">Canadian Regional Intelligence end-to-end architecture</title>
  <desc id="desc">Statistics Canada data is acquired by an Azure Container Apps Job, landed immutably in ADLS Gen2, delivered through Event Grid and a storage queue to Snowpipe, processed in Snowflake through RAW, Streams, Tasks, a SQL stored procedure, quality gates, historized CORE tables, analytical mart views, and a Tableau dashboard. Terraform, GitHub Actions, RBAC, audit, and cost controls govern all layers.</desc>

  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#46566A"/>
    </marker>
    <marker id="arrow-pass" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#207A4A"/>
    </marker>
    <marker id="arrow-fail" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#B4532A"/>
    </marker>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#172B4D" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #172B4D; }
      .subtitle { font: 400 18px Arial, Helvetica, sans-serif; fill: #5B6878; }
      .layer-title { font: 700 21px Arial, Helvetica, sans-serif; fill: #172B4D; }
      .node-title { font: 700 20px Arial, Helvetica, sans-serif; fill: #172B4D; text-anchor: middle; }
      .node-detail { font: 400 16px Arial, Helvetica, sans-serif; fill: #455568; text-anchor: middle; }
      .gate-title { font: 700 18px Arial, Helvetica, sans-serif; fill: #172B4D; text-anchor: middle; }
      .edge-label { font: 700 16px Arial, Helvetica, sans-serif; }
      .governance-title { font: 700 19px Arial, Helvetica, sans-serif; fill: #172B4D; }
      .governance-item { font: 600 16px Arial, Helvetica, sans-serif; fill: #334155; text-anchor: middle; }
      .edge { fill: none; stroke: #46566A; stroke-width: 3; marker-end: url(#arrow); }
      .edge-pass { fill: none; stroke: #207A4A; stroke-width: 3; marker-end: url(#arrow-pass); }
      .edge-fail { fill: none; stroke: #B4532A; stroke-width: 3; marker-end: url(#arrow-fail); }
    </style>
  </defs>

  <rect width="1800" height="1080" fill="#FFFFFF"/>

  <text x="60" y="54" class="title">Canadian Regional Intelligence — End-to-End Data Workflow</text>
  <text x="60" y="84" class="subtitle">Event-driven Azure landing, governed Snowflake ELT, and CMA-level analytical outputs</text>

  <!-- Data sources -->
  <rect x="50" y="110" width="1700" height="135" rx="18" fill="#F6F8FA" stroke="#B8C2CC" stroke-width="2"/>
  <text x="80" y="145" class="layer-title">1 · Official Data Sources</text>

  <rect x="115" y="165" width="310" height="58" rx="12" fill="#FFFFFF" stroke="#8796A5" stroke-width="2" filter="url(#shadow)"/>
  <text x="270" y="200" class="node-title">Statistics Canada WDS</text>

  <rect x="570" y="157" width="1065" height="74" rx="12" fill="#FFFFFF" stroke="#8796A5" stroke-width="2" filter="url(#shadow)"/>
  <line x1="1102" y1="157" x2="1102" y2="231" stroke="#CFD6DD" stroke-width="2"/>
  <text x="836" y="187" class="node-title">Population Estimates</text>
  <text x="836" y="213" class="node-detail">Table 17-10-0148-01</text>
  <text x="1368" y="187" class="node-title">Labour-Market Characteristics</text>
  <text x="1368" y="213" class="node-detail">Table 14-10-0461-01</text>

  <path d="M 425 194 H 540" class="edge"/>

  <!-- Azure -->
  <rect x="50" y="275" width="1700" height="175" rx="18" fill="#EAF4FF" stroke="#5B9BD5" stroke-width="2"/>
  <text x="80" y="312" class="layer-title">2 · Azure Acquisition and Immutable Landing</text>

  <rect x="90" y="338" width="390" height="78" rx="12" fill="#FFFFFF" stroke="#5B9BD5" stroke-width="2" filter="url(#shadow)"/>
  <text x="285" y="369" class="node-title">Azure Container Apps Job</text>
  <text x="285" y="396" class="node-detail">Scheduled Python acquisition</text>

  <rect x="560" y="338" width="390" height="78" rx="12" fill="#FFFFFF" stroke="#5B9BD5" stroke-width="2" filter="url(#shadow)"/>
  <text x="755" y="369" class="node-title">ADLS Gen2</text>
  <text x="755" y="396" class="node-detail">ZIP · CSV · manifest · READY</text>

  <rect x="1030" y="338" width="280" height="78" rx="12" fill="#FFFFFF" stroke="#5B9BD5" stroke-width="2" filter="url(#shadow)"/>
  <text x="1170" y="369" class="node-title">Azure Event Grid</text>
  <text x="1170" y="396" class="node-detail">READY events only</text>

  <rect x="1390" y="338" width="280" height="78" rx="12" fill="#FFFFFF" stroke="#5B9BD5" stroke-width="2" filter="url(#shadow)"/>
  <text x="1530" y="369" class="node-title">Storage Queue</text>
  <text x="1530" y="396" class="node-detail">Snowpipe notifications</text>

  <path d="M 480 377 H 530" class="edge"/>
  <path d="M 950 377 H 1000" class="edge"/>
  <path d="M 1310 377 H 1360" class="edge"/>
  <path d="M 1102 231 V 258 H 285 V 322" class="edge"/>

  <!-- Snowflake -->
  <rect x="50" y="480" width="1700" height="235" rx="18" fill="#F1EFFF" stroke="#7669D4" stroke-width="2"/>
  <text x="80" y="517" class="layer-title">3 · Snowflake Ingestion, ELT, and Quality Gate</text>

  <rect x="85" y="566" width="220" height="82" rx="12" fill="#FFFFFF" stroke="#7669D4" stroke-width="2" filter="url(#shadow)"/>
  <text x="195" y="598" class="node-title">Snowpipe</text>
  <text x="195" y="625" class="node-detail">Control-row ingestion</text>

  <rect x="365" y="566" width="220" height="82" rx="12" fill="#FFFFFF" stroke="#7669D4" stroke-width="2" filter="url(#shadow)"/>
  <text x="475" y="598" class="node-title">RAW Tables</text>
  <text x="475" y="625" class="node-detail">Source + metadata</text>

  <rect x="645" y="566" width="300" height="82" rx="12" fill="#FFFFFF" stroke="#7669D4" stroke-width="2" filter="url(#shadow)"/>
  <text x="795" y="598" class="node-title">Streams + Triggered Tasks</text>
  <text x="795" y="625" class="node-detail">Ordered event processing</text>

  <rect x="1005" y="566" width="300" height="82" rx="12" fill="#FFFFFF" stroke="#7669D4" stroke-width="2" filter="url(#shadow)"/>
  <text x="1155" y="598" class="node-title">Stored Procedure (SQL)</text>
  <text x="1155" y="625" class="node-detail">Idempotent set-based ELT</text>

  <polygon points="1510,535 1640,607 1510,679 1380,607" fill="#FFF8DF" stroke="#D29A16" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1510" y="590" class="gate-title">Quality +</text>
  <text x="1510" y="615" class="gate-title">Reconciliation</text>
  <text x="1510" y="641" class="node-detail">Publish or quarantine</text>

  <path d="M 305 607 H 335" class="edge"/>
  <path d="M 585 607 H 615" class="edge"/>
  <path d="M 945 607 H 975" class="edge"/>
  <path d="M 1305 607 H 1350" class="edge"/>
  <path d="M 1530 416 V 462 H 195 V 550" class="edge"/>

  <!-- Publication -->
  <rect x="50" y="745" width="1700" height="175" rx="18" fill="#EAF8F0" stroke="#4C9A6A" stroke-width="2"/>
  <text x="80" y="782" class="layer-title">4 · Historized Modeling and Analytical Consumption</text>

  <rect x="120" y="818" width="340" height="74" rx="12" fill="#FFFFFF" stroke="#4C9A6A" stroke-width="2" filter="url(#shadow)"/>
  <text x="290" y="847" class="node-title">CORE Historized Facts</text>
  <text x="290" y="874" class="node-detail">Current + historical records</text>

  <rect x="600" y="818" width="340" height="74" rx="12" fill="#FFFFFF" stroke="#4C9A6A" stroke-width="2" filter="url(#shadow)"/>
  <text x="770" y="847" class="node-title">Analytical MART Views</text>
  <text x="770" y="874" class="node-detail">CMA-year + regional outlook</text>

  <rect x="1080" y="818" width="300" height="74" rx="12" fill="#FFFFFF" stroke="#4C9A6A" stroke-width="2" filter="url(#shadow)"/>
  <text x="1230" y="847" class="node-title">Tableau Dashboard</text>
  <text x="1230" y="874" class="node-detail">Interactive + static evidence</text>

  <rect x="1460" y="818" width="240" height="74" rx="12" fill="#FFF0EA" stroke="#C65D36" stroke-width="2" filter="url(#shadow)"/>
  <text x="1580" y="847" class="node-title">Quarantine</text>
  <text x="1580" y="874" class="node-detail">OPS audit trail</text>

  <path d="M 460 855 H 570" class="edge-pass"/>
  <path d="M 940 855 H 1050" class="edge-pass"/>
  <path d="M 1468 664 V 742 H 290 V 802" class="edge-pass"/>
  <text x="1398" y="699" class="edge-label" fill="#207A4A">PASS</text>
  <path d="M 1552 665 V 802" class="edge-fail"/>
  <text x="1570" y="731" class="edge-label" fill="#B4532A">FAIL</text>

  <!-- Governance -->
  <rect x="50" y="950" width="1700" height="95" rx="18" fill="#F3F4F6" stroke="#98A2AE" stroke-width="2"/>
  <text x="80" y="986" class="governance-title">Operations and governance across every layer</text>

  <rect x="520" y="973" width="180" height="46" rx="23" fill="#FFFFFF" stroke="#A7B0BA" stroke-width="1.5"/>
  <text x="610" y="1002" class="governance-item">Terraform</text>
  <rect x="735" y="973" width="200" height="46" rx="23" fill="#FFFFFF" stroke="#A7B0BA" stroke-width="1.5"/>
  <text x="835" y="1002" class="governance-item">GitHub Actions</text>
  <rect x="970" y="973" width="160" height="46" rx="23" fill="#FFFFFF" stroke="#A7B0BA" stroke-width="1.5"/>
  <text x="1050" y="1002" class="governance-item">RBAC</text>
  <rect x="1165" y="973" width="190" height="46" rx="23" fill="#FFFFFF" stroke="#A7B0BA" stroke-width="1.5"/>
  <text x="1260" y="1002" class="governance-item">Audit Tables</text>
  <rect x="1390" y="973" width="270" height="46" rx="23" fill="#FFFFFF" stroke="#A7B0BA" stroke-width="1.5"/>
  <text x="1525" y="1002" class="governance-item">Cost Controls + Auto-Suspend</text>
</svg>
